name: Build N60 Pro OpenWrt

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-n60pro.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex g++ gawk gcc-multilib gettext \
            git libelf-dev libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget

      - name: Checkout official OpenWrt
        run: git clone --depth 1 --branch openwrt-25.12 https://github.com/openwrt/openwrt.git openwrt

      - name: Add OpenClash
        run: git clone --depth 1 https://github.com/vernesong/OpenClash.git openwrt/package/luci-app-openclash

      - name: Configure N60 Pro
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install luci luci-compat luci-proto-wireguard
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n60-pro=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_luci-proto-wireguard=y
          EOF
          make defconfig

      - name: Download sources and build firmware
        working-directory: openwrt
        run: |
          make download -j$(nproc)
          make -j$(nproc) V=s

      - name: Upload N60 Pro sysupgrade image
        uses: actions/upload-artifact@v4
        with:
          name: n60pro-openwrt-openclash-wireguard
          path: openwrt/bin/targets/mediatek/filogic/*netcore_n60-pro*sysupgrade.itb
          if-no-files-found: error
          retention-days: 7
